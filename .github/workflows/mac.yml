name: mac

on:
  push:
    branches: [main]
    paths:
      - "mac/**"
      - ".github/workflows/mac.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        shell: bash
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build and package AgentBar.app
        id: package
        run: bash build-app.sh

      - name: Verify bundle
        run: |
          set -euo pipefail
          test -f build/AgentBar.app/Contents/Info.plist
          test -x build/AgentBar.app/Contents/MacOS/AgentBar
          test -s build/AgentBar-mac.zip
          lipo -info build/AgentBar.app/Contents/MacOS/AgentBar
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" build/AgentBar.app/Contents/Info.plist | grep -qx true
          codesign --verify --verbose build/AgentBar.app

      - name: Smoke test (launches and stays up)
        run: |
          set -euo pipefail
          # Real launch on the runner. No Claude/Codex sessions exist here, so this only proves
          # the app starts, scans the (missing) session folders without crashing, and keeps running.
          ./build/AgentBar.app/Contents/MacOS/AgentBar > smoke.log 2>&1 &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "AgentBar exited within 8 seconds:"; cat smoke.log; exit 1
          fi
          # Screenshot the real menu bar while it runs (full-width strip + whole screen), for review.
          screencapture -x menubar-full.png || true
          kill "$PID"
          echo "AgentBar stayed up for 8 seconds"
          cat smoke.log

      - name: Upload smoke-test screenshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-smoke-screenshot
          path: mac/menubar-full.png
          if-no-files-found: ignore

      - name: Upload AgentBar-mac.zip
        uses: actions/upload-artifact@v4
        with:
          name: AgentBar-mac
          path: mac/build/AgentBar-mac.zip
          if-no-files-found: error

      - name: Fail if the build failed
        if: ${{ failure() }}
        run: |
          echo "::error::AgentBar macOS build or packaging failed"
          exit 1
