ShortDescription: Every running Claude Code and Codex chat as a status square in your Windows taskbar.
Description: AgentBar shows each running Claude Code and OpenAI Codex CLI chat as a square in the Windows taskbar. The background shows its status (working, done, needs an answer, idle) and clicking a square brings that chat's window to the front. It reads only local session files, with no network access.
